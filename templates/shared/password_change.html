{% extends "app.html" %}{% load ui %}
{% block heading %}Change password{% endblock %}
{% block content %}
<div class="card" style="max-width:520px">
  <form method="post" style="display:grid;gap:16px">{% csrf_token %}
    {% for field in form %}{% include "partials/field.html" %}{% endfor %}
    <button class="btn primary" type="submit">{% icon 'key' %} Update password</button>
  </form>
</div>
{% endblock %}
